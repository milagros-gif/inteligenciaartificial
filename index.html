<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detector de Uvas</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4ec, #fff5f8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #d6336c;
            margin-bottom: 10px;
        }

        .descripcion {
            color: #666;
            margin-bottom: 25px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #f3a6bd;
            border-radius: 12px;
            background: #fff8fa;
            cursor: pointer;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #d6336c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #b82d5c;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #imagen {
            display: none;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin: 20px 0;
            border-radius: 15px;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            background: #fff0f5;
            color: #444;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }

        .cargando {
            color: #d6336c;
            margin-top: 15px;
            font-weight: bold;
        }

        .error {
            color: #dc3545;
            margin-top: 15px;
            font-weight: bold;
        }

        .barra {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progreso {
            height: 100%;
            background: #d6336c;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>🍇 Detector de Uvas</h1>

        <p class="descripcion">
            Selecciona una imagen para identificar si la uva es buena o mala.
        </p>

        <input
            type="file"
            id="archivo"
            accept="image/*"
        >

        <img id="imagen" alt="Imagen seleccionada">

        <button id="btnAnalizar" disabled>
            Analizar Uva
        </button>

        <div id="estado" class="cargando">
            Cargando modelo...
        </div>

        <div class="barra">
            <div id="progreso" class="progreso"></div>
        </div>

        <div id="resultado"></div>

    </div>

    <script>

        // ==========================================
        // UBICACIÓN DEL MODELO
        // ==========================================

        const URL = "./";

        let modelo = null;
        let imagenSeleccionada = null;


        // ==========================================
        // ELEMENTOS HTML
        // ==========================================

        const archivo = document.getElementById("archivo");
        const imagen = document.getElementById("imagen");
        const btnAnalizar = document.getElementById("btnAnalizar");
        const estado = document.getElementById("estado");
        const resultado = document.getElementById("resultado");
        const progreso = document.getElementById("progreso");


        // ==========================================
        // CARGAR MODELO
        // ==========================================

        async function cargarModelo() {

            try {

                estado.innerText = "⏳ Cargando modelo...";
                progreso.style.width = "30%";

                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                console.log("Model URL:", modelURL);
                console.log("Metadata URL:", metadataURL);

                modelo = await tmImage.load(
                    modelURL,
                    metadataURL
                );

                progreso.style.width = "100%";

                estado.innerText = "✅ Modelo cargado correctamente";
                estado.style.color = "#198754";

                btnAnalizar.disabled = false;

                console.log("Modelo cargado correctamente");
                console.log("Cantidad de clases:", modelo.getTotalClasses());

            } catch (error) {

                console.error("ERROR AL CARGAR EL MODELO:", error);

                estado.innerText =
                    "❌ No se pudo cargar el modelo";

                estado.className = "error";

                progreso.style.width = "0%";

            }

        }


        // ==========================================
        // SELECCIONAR IMAGEN
        // ==========================================

        archivo.addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {

                imagen.src = e.target.result;

                imagen.style.display = "block";

                resultado.style.display = "none";

                imagenSeleccionada = imagen;

            };

            reader.readAsDataURL(file);

        });


        // ==========================================
        // ANALIZAR IMAGEN
        // ==========================================

        btnAnalizar.addEventListener("click", async function() {

            if (!modelo) {

                alert("El modelo todavía no está cargado.");

                return;
            }

            if (!imagenSeleccionada) {

                alert("Primero selecciona una imagen.");

                return;
            }

            try {

                btnAnalizar.disabled = true;

                estado.innerText = "🔎 Analizando imagen...";
                estado.className = "cargando";

                resultado.style.display = "none";

                const predicciones = await modelo.predict(
                    imagenSeleccionada
                );


                // ==========================================
                // BUSCAR LA PREDICCIÓN MÁS ALTA
                // ==========================================

                let mejorPrediccion = predicciones[0];

                for (let i = 1; i < predicciones.length; i++) {

                    if (
                        predicciones[i].probability >
                        mejorPrediccion.probability
                    ) {

                        mejorPrediccion = predicciones[i];

                    }

                }


                const clase = mejorPrediccion.className;
                const porcentaje =
                    (mejorPrediccion.probability * 100).toFixed(2);


                // ==========================================
                // MOSTRAR RESULTADO
                // ==========================================

                let mensaje = "";

                if (clase.toLowerCase() === "buenas") {

                    mensaje =
                        "🍎 Manzana BUENA<br>" +
                        "Confianza: " +
                        porcentaje +
                        "%";

                } else if (clase.toLowerCase() === "malas") {

                    mensaje =
                        "🍎 Manzana MALA<br>" +
                        "Confianza: " +
                        porcentaje +
                        "%";

                } else {

                    mensaje =
                        "🔎 Resultado: " +
                        clase +
                        "<br>" +
                        "Confianza: " +
                        porcentaje +
                        "%";

                }


                resultado.innerHTML = mensaje;

                resultado.style.display = "block";

                estado.innerText =
                    "✅ Análisis completado";

                estado.style.color = "#198754";


                // Mostrar todas las predicciones en consola

                console.log("Predicciones:");

                predicciones.forEach(function(prediccion) {

                    console.log(
                        prediccion.className +
                        ": " +
                        (prediccion.probability * 100).toFixed(2) +
                        "%"
                    );

                });

            } catch (error) {

                console.error(
                    "ERROR AL ANALIZAR:",
                    error
                );

                estado.innerText =
                    "❌ Error al analizar la imagen";

            }

            btnAnalizar.disabled = false;

        });


        // ==========================================
        // INICIAR
        // ==========================================

        cargarModelo();

    </script>

</body>
</html>
